<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="70%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with Stadium Grass Vibes -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="200" r="220" fill="url(#spotlight)" />

  <!-- Gold Ring Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Goal Post Silhouette Behind -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <line x1="160" y1="90" x2="160" y2="280" />
    <line x1="352" y1="90" x2="352" y2="280" />
    <line x1="160" y1="190" x2="352" y2="190" />
    <line x1="256" y1="190" x2="256" y2="350" />
  </g>

  <!-- Rugby Ball Group angled 35 deg -->
  <g transform="translate(256, 256) rotate(-35)" filter="url(#shadow)">
    <!-- Ball Outer Oval -->
    <ellipse cx="0" cy="0" rx="175" ry="110" fill="url(#ballGrad)" stroke="#fef3c7" stroke-width="4" />
    
    <!-- White Grip Stripes -->
    <path d="M -95 -88 C -70 -30, -70 30, -95 88" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.9" />
    <path d="M 95 -88 C 70 -30, 70 30, 95 88" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.9" />

    <!-- Center Seam -->
    <line x1="-165" y1="0" x2="165" y2="0" stroke="#451a03" stroke-width="4" stroke-linecap="round" />

    <!-- White Rugby Laces -->
    <rect x="-42" y="-5" width="84" height="10" rx="5" fill="#f8fafc" />
    <line x1="-28" y1="-18" x2="-28" y2="18" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
    <line x1="-14" y1="-18" x2="-14" y2="18" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
    <line x1="14" y1="-18" x2="14" y2="18" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />
    <line x1="28" y1="-18" x2="28" y2="18" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />

    <!-- Glossy Highlight -->
    <ellipse cx="-20" cy="-45" rx="90" ry="25" fill="#ffffff" opacity="0.22" transform="rotate(-5)" />
  </g>

  <!-- Speed Swooshes -->
  <path d="M 90 390 Q 210 430 380 390" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  <path d="M 140 420 Q 240 450 340 425" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Stars of Excellence -->
  <polygon points="256,58 262,72 277,72 265,82 269,96 256,86 243,96 247,82 235,72 250,72" fill="#fbbf24" />
</svg>
